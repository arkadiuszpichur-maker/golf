<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dziennik uderzeń – golf</title>
<!-- PWA: instalacja na ekranie głównym telefonu i praca bez zasięgu -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F5A3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Golf">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --surface2:#E3E8E4; --ink:#16201B; --muted:#5E6B64; --line:#C9D1CB;
  --green:#245C43; --green-ink:#FFFFFF; --flag:#E2B225;
  --g0:#16703F; --g1:#5E9F68; --g2:#8E9690; --g3:#D98E2F; --g4:#BF3F33;
  --under:#16703F; --over:#BF3F33;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1B231F; --surface2:#25302A; --ink:#E6ECE8; --muted:#97A39C; --line:#33403A;
    --green:#3F8A66; --green-ink:#0E1411; --flag:#E8BC3A;
    --g0:#3FAE6E; --g1:#7FBE88; --g2:#7D8781; --g3:#E5A04A; --g4:#E0675B;
    --under:#5CC489; --over:#E86F62; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1B231F; --surface2:#25302A; --ink:#E6ECE8; --muted:#97A39C; --line:#33403A;
  --green:#3F8A66; --green-ink:#0E1411; --flag:#E8BC3A;
  --g0:#3FAE6E; --g1:#7FBE88; --g2:#7D8781; --g3:#E5A04A; --g4:#E0675B;
  --under:#5CC489; --over:#E86F62; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;letter-spacing:.01em}
h2{font-size:1.6rem;margin:1.4rem 0 .6rem;font-weight:600}
h3{font-size:1.2rem;margin:1rem 0 .4rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px}
header.top h1{margin:0;font-size:1.35rem;font-weight:700;flex:1}
.sync{white-space:nowrap;font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g2)}
.dot.ok{background:var(--g0)}.dot.err{background:var(--g4)}.dot.wait{background:var(--flag)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){
  .sync span:last-child{display:none}
  header.top h1{font-size:1.15rem}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  nav.tabs button{flex:1;padding:10px 4px}
}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;font-weight:600}
.btn.primary{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--g4)}
.btn.dangerfill{background:var(--g4);border-color:var(--g4);color:#fff}
.modal-back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;padding:16px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal p{margin:0 0 14px;line-height:1.45}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
label.f input,label.f select,textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:1rem;color:var(--ink);max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
/* round list */
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.ritem .sc{font-family:"Barlow Condensed",sans-serif;font-size:1.8rem;font-weight:700;min-width:2.4ch;text-align:right}
.ritem .meta{flex:1}
/* hole screen */
.holehead{display:flex;align-items:flex-end;gap:16px;margin-top:10px}
.holeno{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:5.2rem;line-height:.82}
.holeno small{display:block;font-size:.95rem;font-weight:600;color:var(--muted);letter-spacing:.02em;line-height:1.2}
.parbox{display:flex;align-items:center;gap:6px}
.parbox b{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem}
.step{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700}
.holescore{margin-left:auto;text-align:right}
.holescore .n{font-family:"Barlow Condensed",sans-serif;font-size:3rem;font-weight:700;line-height:.9}
.strip{display:flex;gap:4px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:thin}
.strip button{flex:0 0 auto;width:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 0;line-height:1.1;font-size:.75rem;color:var(--muted)}
.strip button b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;color:var(--ink)}
.strip button[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.strip .u b{color:var(--under)}.strip .o b{color:var(--over)}
.shots{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:4px}
.shot{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%;text-align:left}
.shot.sel{border-color:var(--flag);box-shadow:inset 0 0 0 1px var(--flag)}
.shot .i{color:var(--muted);font-size:.85rem;min-width:1.4em}
.shot .t{flex:1}
.gb{display:inline-flex;align-items:center;justify-content:center;min-width:2.3em;height:1.9em;border-radius:6px;color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;padding:0 .3em}
.gb.g0{background:var(--g0)}.gb.g1{background:var(--g1)}.gb.g2{background:var(--g2)}.gb.g3{background:var(--g3)}.gb.g4{background:var(--g4)}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.entry .lbl{font-size:.8rem;color:var(--muted);margin:6px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:20px;padding:7px 12px;font-weight:500;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.clubs .chip{border-radius:8px;padding:8px 0;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:1.1rem;font-weight:600;min-width:0}
.clubs .chip small{display:block;font-family:Barlow,sans-serif;font-size:.62rem;font-weight:500;line-height:1.15;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.clubcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--surface)}
.clubcard.out{opacity:.6}
.cc1{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:end}
.cc2{display:grid;grid-template-columns:minmax(110px,140px) minmax(150px,1fr) auto;gap:8px;align-items:end;margin-top:6px}
.cbtn{gap:2px;flex-wrap:nowrap}
.unit{display:flex;align-items:center;gap:4px}.unit input{width:100%;min-width:0}.unit span{color:var(--muted);font-size:.9rem}
.bagtoggle{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-weight:600;font-size:.92rem;white-space:nowrap;cursor:pointer}
.bagtoggle input{width:20px;height:20px;margin:0}
.clublegend{margin:.2rem 0 .6rem;padding-left:1.1rem}.clublegend li{margin:.25rem 0}
@media (max-width:520px){.cc2{grid-template-columns:1fr 1fr}.cc2 .bagtoggle{grid-column:1/-1;justify-content:center}}
.atkex{font-size:.82rem;color:var(--muted);margin-top:8px}
.flowp{border-color:var(--green);margin-top:12px}
.btn.small{padding:4px 10px;font-size:.85rem}
.delarm .btn{padding:9px 10px}
.distbox{margin:8px 0 2px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.distrow{display:grid;grid-template-columns:48px 44px 1fr 44px 48px;gap:6px;align-items:center;margin-top:4px}
.step2{height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;font-weight:600;padding:0;touch-action:manipulation}
.distnum{display:flex;align-items:baseline;justify-content:center;gap:4px;min-width:0}
.distnum input{width:100%;max-width:130px;border:0;background:transparent;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:2.6rem;font-weight:700;line-height:1;color:var(--ink);padding:0;-moz-appearance:textfield;appearance:textfield}
.distnum input::-webkit-outer-spin-button,.distnum input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.distnum span{color:var(--muted);font-weight:600}
.dial{position:relative;height:58px;margin-top:8px;overflow:hidden;border-radius:10px;background:var(--surface);border:1px solid var(--line);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.dial.drag{cursor:grabbing}
.dial .tape{position:absolute;top:0;bottom:0;left:50%;width:5208px;transform:translateX(calc(var(--m) * -8px - 1px));will-change:transform;
  background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 80px) left bottom/100% 26px no-repeat,repeating-linear-gradient(90deg,var(--muted) 0 2px,transparent 2px 40px) left bottom/100% 17px no-repeat,repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 8px) left bottom/100% 10px no-repeat}
.dial .tape span{position:absolute;top:5px;transform:translateX(-50%);font-family:"Barlow Condensed",sans-serif;font-size:.95rem;font-weight:600;color:var(--muted);pointer-events:none}
.dial .needle{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--flag);border-radius:2px;pointer-events:none}
.pbrow{display:grid;grid-template-columns:1fr minmax(110px,160px) auto;gap:6px;align-items:center;margin:5px 0}
tr.grp td{background:var(--surface2);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
.steps .chip{padding:8px 0;text-align:center;border-radius:8px;font-family:"Barlow Condensed",sans-serif;font-size:1.1rem;font-weight:600}
.steps input{grid-column:span 2;padding:6px 8px}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:10px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.warn{background:color-mix(in srgb,var(--g3) 22%,transparent);color:var(--ink)}
.teerow{display:grid;grid-template-columns:minmax(90px,1.4fr) 64px 76px 70px 80px 64px auto;gap:6px;align-items:center;margin:5px 0;min-width:560px}
.teerow.h{font-size:.75rem;color:var(--muted)}
.cline{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:5px 0}
.cline[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.grade{border:0;border-radius:10px;color:#fff;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:92px}
.grade .s{font-family:"Barlow Condensed",sans-serif;font-size:1.9rem;font-weight:700;line-height:1}
.grade .c{font-size:.72rem;line-height:1.15;text-align:center;opacity:.95}
.grade.g0{background:var(--g0)}.grade.g1{background:var(--g1)}.grade.g2{background:var(--g2)}.grade.g3{background:var(--g3)}.grade.g4{background:var(--g4)}
.grade[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.firrow .chip{min-width:64px;text-align:center}
table.card{background:var(--surface)}
table.card td,table.card th{text-align:center;padding:6px 4px}
table.card td:first-child,table.card th:first-child{text-align:center;font-weight:600}
.scm{display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.9em;font-weight:600}
.scm.birdie{border:1.5px solid var(--under);border-radius:50%}
.scm.eagle{border:1.5px solid var(--under);border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--under)}
.scm.bogey{border:1.5px solid var(--over)}
.scm.dbl{border:1.5px solid var(--over);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--over)}
.entry .kpis{grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.entry .kpi .v{font-size:1.7rem}
.navrow{display:flex;gap:8px;margin-top:12px}
.navrow .btn{flex:1;padding:12px}
details.more summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:6px 0}
/* analysis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:12px}
.kpi .v{font-family:"Barlow Condensed",sans-serif;font-size:2rem;font-weight:700;line-height:1}
.kpi .l{font-size:.8rem;color:var(--muted);margin-top:4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.8rem}
th:first-child,td:first-child{text-align:left}
td.dist{min-width:150px}
.distbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.distbar span{display:block;height:100%}
.pos{color:var(--under);font-weight:600}.neg{color:var(--over);font-weight:600}
.div{display:grid;grid-template-columns:minmax(110px,170px) 1fr 64px;gap:6px 10px;align-items:center;font-size:.92rem}
.div .track{position:relative;height:18px;background:var(--surface2);border-radius:4px}
.div .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.div .bar{position:absolute;top:2px;bottom:2px;border-radius:3px}
.insight{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.insight .panel{margin:0}
.rtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rtile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.rtile:hover{border-color:var(--ink)}
.rtile .rsc{font-size:1.9rem;font-weight:700;line-height:1}
.rstats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted)}
.rstats span{display:flex;align-items:baseline;gap:3px}
.rstats b{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;color:var(--ink)}
.rstats b.neg{color:var(--over)}
.tlist{display:grid;grid-template-columns:minmax(0,1fr) auto auto 64px;gap:4px 10px;align-items:center;font-size:.84rem;padding-top:6px;border-top:1px solid var(--line)}
.tlist>span:nth-child(4n+1){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .th{font-size:.72rem;color:var(--muted)}.tlist .r{text-align:right}.tlist .tot{font-weight:700;border-top:1px solid var(--line);padding-top:3px}
.tlist .distbar{height:9px}
.tgr{display:flex;flex-direction:column;gap:5px;padding-top:6px;border-top:1px solid var(--line)}
.tgrh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tgrc{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.gsp{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem}
.gsp b{font-family:"Barlow Condensed",sans-serif;font-size:1.1rem;line-height:1}
.gsp .gb{font-size:.78rem;height:1.45em;min-width:2em}
.insight ol{margin:.3rem 0 0;padding-left:1.2rem}
.heat td{text-align:center;font-size:.85rem}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
svg.trend{width:100%;height:auto;display:block}
.hrev{display:grid;grid-template-columns:44px 40px 46px 1fr;gap:6px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.hrev .seq{display:flex;flex-wrap:wrap;gap:4px}
.mini{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:1px 5px 1px 1px;font-size:.78rem;background:var(--surface)}
.mini .gb{font-size:.8rem;height:1.5em;min-width:1.8em}
/* settings */
.typecard{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--surface)}
.critgrid{display:grid;grid-template-columns:36px 1fr;gap:5px 8px;align-items:center;margin-top:8px}
.critgrid .gb{width:36px}
.critgrid input{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:20;font-size:.9rem}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
@media (min-width:900px){
  .holegrid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>Dziennik uderzeń</h1>
  <select id="playerSel" class="inp" aria-label="Gracz" style="max-width:170px;padding:5px 8px;font-size:.92rem"></select>
  <span class="sync" id="sync"><span class="dot"></span><span>lokalnie</span></span>
  <nav class="tabs" id="tabs">
    <button data-act="view" data-v="round">Runda</button>
    <button data-act="view" data-v="analysis">Analiza</button>
    <button data-act="view" data-v="compare">Porównanie</button>
    <button data-act="view" data-v="settings">Ustawienia</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
(function(){

  const c=ghCfg();if(!c.token||!c.repo){if(manual)toast('Uzupełnij repozytorium i token');return}

    if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(g.status===401?'nieprawidłowy token':g.status===403?'brak uprawnień tokenu':'HTTP '+g.status);

async function initSync(){
  try{
    if(!window.claude||!window.claude.use){setSync('','tylko lokalnie');return}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){setSync('','tylko lokalnie');return}
    const id=await user.id();if(!id){setSync('','tylko lokalnie');return}
    COL=db.collection('data/users/'+id);
    COL.onSnapshot(snap=>{
      let changed=false;const seen=new Set();
      snap.docs.forEach(d=>{
        const v=d.data();if(!v)return;seen.add(d.id);
        if(d.id==='settings'){
          if((v.updated||0)>(S.settings.updated||0)&&!meta.dirty.settings){S.settings=normalize(clone(v));changed=true}
          else if((v.updated||0)<(S.settings.updated||0))meta.dirty.settings=meta.dirty.settings||Date.now();
        }else if(d.id.startsWith('r-')){
          const rid=d.id.slice(2),loc=S.rounds[rid];
          if(v.deleted){if(loc&&(v.updated||0)>=(loc.updated||0)){delete S.rounds[rid];S.tomb[rid]=v.updated;changed=true}}
          else if(S.tomb[rid]&&S.tomb[rid]>=(v.updated||0)){meta.dirty[d.id]=meta.dirty[d.id]||Date.now()}
          else if(!loc||((v.updated||0)>(loc.updated||0)&&!meta.dirty[d.id])){S.rounds[rid]=clone(v);changed=true}
          else if((v.updated||0)<(loc.updated||0))meta.dirty[d.id]=meta.dirty[d.id]||Date.now();
        }
      });
      if(firstSnap){firstSnap=false;
        if(!seen.has('settings'))meta.dirty.settings=Date.now();
        Object.keys(S.rounds).forEach(rid=>{if(!seen.has('r-'+rid))meta.dirty['r-'+rid]=Date.now()});
      }
      if(changed){lsSave();render()}
      if(Object.keys(meta.dirty).length)flush();else setSync('ok','zsynchronizowano');
    },e=>setSync('err','synchronizacja przerwana – zapis lokalny'));
  }catch(e){setSync('','tylko lokalnie')}
}

function holeSummary(r,h,hsr){

      ${it('Up &amp; down',...ok(ud))}${it('Sand save',...ok(sand))}${it('Scrambling',...ok(scrb))}

  </div>`;
}

function filteredRounds(){

}
function aggregate(rs){
  const V=P().values;
  const byType={},byClub={},matrix={};const shotRounds=Math.round(rs.filter(r=>!r._part&&r.holes.some(h=>h.shots.length)).reduce((a,r)=>a+r.holes.length,0)/18*100)/100;
  const add=(o,k,g,f)=>{const e=o[k]||(o[k]={n:0,dist:[0,0,0,0,0],sum:0,nF:0,distF:[0,0,0,0,0],sumF:0});e.n++;e.dist[g]++;e.sum+=V[g];if(f){e.nF++;e.distF[g]++;e.sumF+=V[g]}};
  rs.forEach(r=>{const f=!r._part;r.holes.forEach(h=>h.shots.forEach(s=>{add(byType,s.t,s.g,f);add(byClub,s.c,s.g,f);add(matrix,s.t+'|'+s.c,s.g,f)}))});
  return {byType,byClub,matrix,shotRounds};
}

  let T={strokes:0,par:0,played:0,putts:0,puttH:0,gir:0,girH:0,fir:0,firH:0,scr:0,scrH:0,sandS:0,sandH:0,ud:0,udH:0,pen:0};let full=[];

function kpiStats(rs){
  const T={strokes:0,par:0,played:0,putts:0,puttH:0,gir:0,girH:0,fir:0,firH:0,scr:0,scrH:0,sandS:0,sandH:0,ud:0,udH:0,pen:0};const full=[];
  const TF={strokes:0,par:0,played:0,putts:0,puttH:0,pen:0};
  rs.forEach(r=>{const t=roundTotals(r);Object.keys(T).forEach(k=>T[k]+=t[k]);if(!r._part){Object.keys(TF).forEach(k=>TF[k]+=t[k]);full.push(t)}});
  const p18=TF.played?18/TF.played:null;const pc=(a,b)=>b?a/b*100:null;
  const ptsR=full.filter(t=>t.pts!=null&&t.played),diffR=full.filter(t=>t.diff!=null);
  return {n:rs.filter(r=>!r._part).length,score:p18?TF.strokes*p18:null,vspar:p18?(TF.strokes-TF.par)*p18:null,fir:pc(T.fir,T.firH),gir:pc(T.gir,T.girH),putts:TF.puttH?TF.putts/TF.puttH*18:null,
    scr:pc(T.scr,T.scrH),ud:pc(T.ud,T.udH),sand:pc(T.sandS,T.sandH),pen:p18?TF.pen*p18:null,pts:ptsR.length?ptsR.reduce((a,t)=>a+t.pts*18/t.played,0)/ptsR.length:null,diff:diffR.length?diffR.reduce((a,t)=>a+t.diff,0)/diffR.length:null};
}
function puttStats(rs){
  let nR=0,len=0,made=0,lenF=0,madeF=0;const firsts=[],G={};
  rs.forEach(r=>{let known=0;r.holes.forEach(h=>{const sh=h.shots;let fd=false;sh.forEach((s,i)=>{if(roleOf(s.t)!=='putt')return;const st=puttSteps(s);const holed=i===sh.length-1;
    if(!fd){if(st!=null)firsts.push(st);fd=true}if(st==null)return;known++;len+=st;if(holed)made+=st;
    const b=bucketFor(st);const e=G[b.group]||(G[b.group]={n:0,made:0});e.n++;if(holed)e.made++;if(!r._part){lenF+=st;if(holed)madeF+=st}})});if(known&&!r._part)nR+=r.holes.length/18});
  return {nR,lenR:nR?lenF/nR:null,madeR:nR?madeF/nR:null,pctLen:len?made/len*100:null,first:firsts.length?firsts.reduce((a,b)=>a+b,0)/firsts.length:null,G};
}

function trendSvg(pts){
  const W=640,H=200,P=30;const vals=pts.filter(p=>p.avg!=null);
  if(vals.length<2)return '<p class="muted small">Trend pojawi się, gdy ten rodzaj uderzenia wystąpi w co najmniej dwóch rundach.</p>';
  const mx=Math.max(...(S.settings.players.find(p=>p.id===S.settings.activePlayer)||S.settings.players[0]).values.map(Math.abs));
  const x=i=>P+i*(W-2*P)/Math.max(1,pts.length-1);const y=v=>H/2-(v/mx)*(H/2-P/1.2);
  let path='',dots='';let started=false;
  pts.forEach((p,i)=>{if(p.avg==null)return;path+=(started?'L':'M')+x(i).toFixed(1)+' '+y(p.avg).toFixed(1)+' ';started=true;
    dots+=`<circle cx="${x(i)}" cy="${y(p.avg)}" r="4.5" fill="${p.avg>=0?'var(--g0)':'var(--g4)'}"><title>${esc(p.r.date)} ${esc(p.r.course||'')}: ${fmt(p.avg)} (${p.n} uderzeń)</title></circle>`});
  const labels=pts.map((p,i)=>(pts.length<=12||i%Math.ceil(pts.length/12)===0)?`<text x="${x(i)}" y="${H-4}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(p.r.date.slice(5))}</text>`:'').join('');
  return `<div class="scroll"><svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend średniej oceny">
    <line x1="${P}" x2="${W-P}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <text x="4" y="${y(mx)+4}" font-size="10" fill="var(--muted)">${fmt(mx,1)}</text><text x="4" y="${y(0)+4}" font-size="10" fill="var(--muted)">0</text><text x="4" y="${y(-mx)+4}" font-size="10" fill="var(--muted)">${fmt(-mx,1)}</text>
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"/>${dots}${labels}</svg></div>`;
}

function courseValidation(c){
  const n=c.n||18;const p=c.pars.slice(0,n),si=c.si.slice(0,n);const out=[];
  const pf=p.filter(Boolean);out.push(pf.length===n?`Par ${pf.reduce((a,b)=>a+b,0)}`:`Pary: ${pf.length}/${n}`);
  const sf=si.filter(Boolean);
  if(!sf.length)out.push('SI: brak');
  else{const dup=sf.length!==new Set(sf).size;const bad=sf.some(x=>x<1||x>18);out.push(sf.length<n?`SI: ${sf.length}/${n}`:dup||bad?'SI: powtórzenia lub wartości spoza 1–18':'SI: OK')}
  return `<span class="muted">${out.join(' · ')}</span>`;
}
function readSet(el){
  const g=draftS,s=dP(),k=el.dataset.set,i=+el.dataset.i,v=el.value;
  if(k==='tname')s.types[i].name=v;
  else if(k==='tclub')s.types[i].club=v;

  else if(k==='val')s.values[+el.dataset.g]=parseFloat(v.replace(',','.'))||0;
  else if(k==='minN')s.minN=Math.max(1,parseInt(v)||1);
  else if(k==='pexSt'){const x=parseFloat(v.replace(',','.'));s.puttExact[+el.dataset.e].st=isNaN(x)?NaN:Math.round(x*2)/2}
  else if(k==='pexTo'){const x=parseFloat(v.replace(',','.'));s.puttExact[+el.dataset.e].to=isNaN(x)?NaN:Math.round(x*2)/2}
  else if(k==='pexCrit')s.puttExact[+el.dataset.e].crit[+el.dataset.g]=v;
  else if(k==='pcrit'){s.puttCrit=s.puttCrit||{};const a=s.puttCrit[el.dataset.pg]||(s.puttCrit[el.dataset.pg]=['','','','','']);a[+el.dataset.g]=v}
  else if(k==='pname')s.name=v;
  else if(k==='pseason')s.season=v;
  else if(k==='hi'){const x=parseFloat(v.replace(',','.'));s.hi=isNaN(x)?null:x}
  else if(k==='kshort')s.clubs[i].short=v.trim();
  else if(k==='kname')s.clubs[i].name=v;
  else if(k==='kbag')s.clubs[i].bag=el.checked;
  else if(k==='kput')s.clubs[i].putter=el.checked;
  else if(k==='kdist'){const x=parseFloat(v.replace(',','.'));s.clubs[i].m=v.trim()===''?null:(isNaN(x)?NaN:Math.round(x))}
  else if(k==='kkind'){const c=s.clubs[i];c.kind=v;syncKind(c)}
  else if(k==='tatk')s.types[i].atk=el.checked;
  else if(k==='atkOn')s.atk.on=el.checked;
  else if(k==='atkPct'||k==='atkExS'||k==='atkExL'){const x=parseFloat(v.replace(',','.'));s.atk[{atkPct:'pct',atkExS:'exShort',atkExL:'exLong'}[k]]=isNaN(x)?NaN:x}
  else if(k==='atkLong')s.atk.long[+el.dataset.g]=v;
  else if(k==='pgname')g.puttGroups[i].name=v;
  else if(k==='pbmax'){const x=parseFloat(v.replace(',','.'));g.puttBuckets[i].max=isNaN(x)?NaN:x}
  else if(k==='pbgroup')g.puttBuckets[i].group=v;
  else if(k==='cname')g.courses[i].name=v;
  else if(k==='ccity')g.courses[i].city=v;
  else if(k==='cn')g.courses[i].n=parseInt(v);
  else if(k==='cver')g.courses[i].verified=el.checked;
  else if(k==='cpars'||k==='csi'){const arr=v.split(/[,; ]+/).map(x=>parseInt(x)).map(x=>isNaN(x)?null:x);const lo=k==='cpars'?3:1,hi=k==='cpars'?6:18;
    g.courses[i][k==='cpars'?'pars':'si']=arr.map(x=>x!=null&&x>=lo&&x<=hi?x:null);const vb=document.getElementById('cval'+i);if(vb)vb.innerHTML=courseValidation(g.courses[i])}
  else if(k.startsWith('tee')){const t=g.courses[i].tees[+el.dataset.t];const num=x=>{const y=parseFloat(String(x).replace(',','.'));return isNaN(y)?null:y};
    if(k==='teeName')t.name=v;else if(k==='teeG')t.g=v;else if(k==='teeCr')t.cr=num(v);else if(k==='teeSlope')t.slope=num(v);else if(k==='teeLen')t.len=num(v);else if(k==='teeHoles')t.holes=parseInt(v);else if(k==='teeLens')t.lens=v.split(/[,; ]+/).map(x=>parseInt(x)).map(x=>isNaN(x)||x<=0?null:x);}
}
function critFor(cur){const ty=typeById(cur.t);if(!ty)return [];
  if(ty.role==='putt'&&cur.st!=null){const ex=puttExactFor(cur.st);if(ex)return ex.crit;const b=bucketFor(cur.st);const pc=b&&P().puttCrit&&P().puttCrit[b.group];if(pc&&pc.some(Boolean))return pc}
  if(cur.dyn){const a=atkCrit(ty,cur.c);if(a)return a}

function saveSettings(){
  const g=draftS,s=dP();const oldP=S.settings.players.find(p=>p.id===s.id)||{types:[],cv:1,history:[]};

  if(s.clubs.some(c=>!c.short)){toast('Każdy kij potrzebuje skrótu');return}
  {const fin=g.puttBuckets.filter(b=>b.max!==null);if(fin.some(b=>isNaN(b.max)||b.max<=0)){toast('Granica przedziału musi być liczbą większą od 0');return}
   if(new Set(fin.map(b=>b.max)).size!==fin.length){toast('Dwa przedziały mają tę samą granicę');return}}

  if((s.puttExact||[]).some(e=>isNaN(e.st)||e.st<=0)){toast('Odległość wyjątku musi być większa od 0');return}
  {const ex=(s.puttExact||[]).map(e=>({a:e.st,b:e.to??e.st})).sort((x,y)=>x.a-y.a);if(ex.some(e=>isNaN(e.b)||e.b<e.a)){toast('„Do” musi być większe lub równe „od”');return}if(ex.some((e,i)=>i&&e.a<=ex[i-1].b)){toast('Zakresy wyjątków nachodzą na siebie');return}}

  S.settings=g;draftS=null;touchSettings();render();
}

    case 'steps25':{ui.over25=!(ui.over25||(ui.sel!=null?puttSteps(h.shots[ui.sel])>25:ui.draft.st>25));
      if(!ui.over25){if(ui.sel!=null){const sh=h.shots[ui.sel];if(puttSteps(sh)>25){delete sh.st;delete sh.d;touchRound(r)}}else if(ui.draft.st>25)ui.draft.st=null}
      render();if(ui.over25)document.querySelector('[data-act=stepsIn]')?.focus();break;}
    case 'setSteps':{ui.over25=false;const v=parseFloat(el.dataset.v);if(ui.sel!=null){const sh=h.shots[ui.sel];delete sh.d;if(puttSteps(sh)===v)delete sh.st;else sh.st=v;touchRound(r)}else ui.draft.st=ui.draft.st===v?null:v;render();break;}
    case 'setClub':{const c=el.dataset.c;if(ui.sel!=null){h.shots[ui.sel].c=c;touchRound(r)}else{const d=ui.draft;d.c=c;d.cMan=true;const cb=clubById(c);
      if(cb&&cb.m>0&&!cb.putter&&clubSetsDist(d.t)&&d.mSrc!=='man'&&d.mSrc!=='len'){d.m=cb.m;d.mSrc='club'}}render();break;}
    case 'mStep':{const v=curDistM();commitDist((v??(ui.sel==null?0:0))+ +el.dataset.d);break;}
    case 'grade':{const g=+el.dataset.g;if(el.disabled)return;
      if(ui.sel!=null){h.shots[ui.sel].g=g;touchRound(r)}
      else{const ns={t:ui.draft.t,c:ui.draft.c,g};if(roleOf(ui.draft.t)==='putt'&&ui.draft.st!=null)ns.st=ui.draft.st;
        if(roleOf(ns.t)!=='putt'&&ui.draft.m!=null)ns.m=ui.draft.m;if(isAtk(ns.t)&&atkInfo(typeById(ns.t),ns.c))ns.dyn=1;clearTimeout(ui.distT);h.shots.push(ns);if(isHoledPutt(ns)||isHoledShot(ns))h.done=true;
        if(ui.draft.t==='tee'&&h.par>=4&&!h.fir&&g<=1)h.fir='hit';
        touchRound(r);ui.draft=defaultNext(r,h);ui.over25=false;if(navigator.vibrate)navigator.vibrate(15)}
      render();break;}
    case 'selShot':{const i=+el.dataset.i;ui.sel=ui.sel===i?null:i;if(ui.sel==null)ui.draft=defaultNext(r,h);render();break;}
    case 'cancelSel':ui.sel=null;ui.draft=defaultNext(r,h);render();break;
    case 'delShot':h.shots.splice(ui.sel,1);h.done=false;toast('Usunięto uderzenie '+(ui.sel+1));ui.sel=null;ui.draft=defaultNext(r,h);touchRound(r);render();break;
    case 'shotNav':{const d=+el.dataset.d,n=h.shots.length;if(!n)return;
      if(d<0)ui.sel=ui.sel==null?n-1:Math.max(0,ui.sel-1);
      else{if(ui.sel==null)return;if(ui.sel<n-1)ui.sel++;else{ui.sel=null;ui.draft=defaultNext(r,h)}}
      render();break;}
    case 'undoShot':{if(!h.shots.length)return;const n=h.shots.length;h.shots.pop();h.done=false;ui.sel=null;ui.over25=false;ui.draft=defaultNext(r,h);touchRound(r);render();toast('Usunięto uderzenie '+n);break;}
    case 'tileAnalyze':ui.filter='pick';ui.picked=[el.dataset.id];ui.review=el.dataset.id;render();window.scrollTo(0,0);toast('Analiza jednej rundy');break;
    case 'pickRound':{const id=el.dataset.id;ui.picked=ui.picked||[];ui.picked=ui.picked.includes(id)?ui.picked.filter(x=>x!==id):ui.picked.concat([id]);render();break;}
    case 'pickAll':ui.picked=pickPool().map(r=>r.id);render();break;
    case 'pickNone':ui.picked=[];render();break;
    case 'review':ui.review=ui.review===el.dataset.id?null:el.dataset.id;render();break;
    case 'addType':dP().types.push({id:'t'+newId(),name:'Nowy rodzaj',role:'app',club:dP().clubs[0].id,crit:['','','','','']});render();break;
    case 'delType':if(dP().types.length<=1)return;if(!ask(el,'deltype','Usunąć ten rodzaj? Zapisane uderzenia zostaną, ale pokażą się jako „usunięty typ”.',{ok:'Usuń',danger:true}))return;dP().types.splice(+el.dataset.i,1);render();break;
    case 'delCourse':{const c=draftS.courses[+el.dataset.i];if(!ask(el,'delcourse',`Usunąć pole ${c.name}? Rozegrane rundy zostaną.`,{ok:'Usuń',danger:true}))return;draftS.courses.splice(+el.dataset.i,1);ui.editCourse=null;render();break;}
    case 'activatePlayer':{if(!confirmDiscard(el))return;switchPlayer(el.dataset.id);break;}
    case 'newPlayerCopy':{if(!confirmDiscard(el))return;const src=P();const np=clone(src);np.id='p'+newId();
      np.season=/^\d{4}$/.test(src.season||'')?String(+src.season+1):String(new Date().getFullYear());np.cv=1;np.history=[{v:1,at:today(),crit:Object.fromEntries(np.types.map(t=>[t.id,t.crit.slice()]))}];
      S.settings.players.push(np);switchPlayer(np.id);toast('Utworzono gracza '+playerLabel(np));break;}
    case 'newPlayerBlank':{if(!confirmDiscard(el))return;const np=normalize(defaultSettings()).players[0];np.id='p'+newId();np.name='Nowy gracz';np.season=String(new Date().getFullYear());
      S.settings.players.push(np);switchPlayer(np.id);toast('Utworzono gracza – uzupełnij imię i HCP');break;}
    case 'delPlayer':{const pl=S.settings.players.find(p=>p.id===el.dataset.id);if(!pl||rounds().some(r=>roundPlayer(r)===pl.id))return;if(!ask(el,'delpl',`Usunąć gracza ${playerLabel(pl)}?`,{ok:'Usuń',danger:true}))return;if(!confirmDiscard(el))return;
      S.settings.players=S.settings.players.filter(p=>p.id!==pl.id);if(S.settings.activePlayer===pl.id)S.settings.activePlayer=S.settings.players[0].id;touchSettings();render();break;}
    case 'cmpToggle':{const id=el.dataset.id;ui.cmp=ui.cmp.includes(id)?ui.cmp.filter(x=>x!==id):ui.cmp.concat([id]);render();break;}
    case 'addPex':{const ex=dP().puttExact||(dP().puttExact=[]);const top=ex.length?Math.max(...ex.map(e=>e.to??e.st)):0;const st=Math.floor(top)+1;ex.push({st,to:st,crit:['Trafiony','','','','']});render();break;}
    case 'delPex':dP().puttExact.splice(+el.dataset.e,1);render();break;
    case 'addPG':draftS.puttGroups.push({id:'pg'+newId(),name:'Nowa grupa'});render();break;
    case 'delPG':{const i=+el.dataset.i;if(draftS.puttGroups.length<2)return;const g=draftS.puttGroups[i];draftS.puttGroups.splice(i,1);
      const to=draftS.puttGroups[Math.max(0,i-1)].id;draftS.puttBuckets.forEach(b=>{if(b.group===g.id)b.group=to});toast('Przedziały przeniesione do grupy '+draftS.puttGroups[Math.max(0,i-1)].name);render();break;}
    case 'addPB':{const fin=draftS.puttBuckets.filter(b=>b.max!=null&&!isNaN(b.max));const top=fin.length?Math.max(...fin.map(b=>b.max)):0;
      const last=bucketsSorted(draftS.puttBuckets).filter(b=>b.max!=null).pop();draftS.puttBuckets.push({id:'pb'+newId(),max:top+5,group:last?last.group:draftS.puttGroups[0].id});render();break;}
    case 'delPB':draftS.puttBuckets.splice(+el.dataset.i,1);render();break;
    case 'addCourse':draftS.courses.push({id:'c'+newId(),name:'Nowe pole',city:'',n:18,pars:[],si:[],tees:[],verified:false});ui.editCourse=draftS.courses.length-1;render();break;
    case 'editCourse':{const i=+el.dataset.i;ui.editCourse=ui.editCourse===i?null:i;render();break;}
    case 'addTee':{const c=draftS.courses[+el.dataset.i];c.tees.push({id:'e'+newId(),name:'',g:'M',cr:null,slope:null,len:null,holes:c.n||18});render();break;}
    case 'delTee':draftS.courses[+el.dataset.i].tees.splice(+el.dataset.t,1);render();break;
    case 'addClub':dP().clubs.push({id:'k'+newId(),short:'',name:'',bag:true,m:null,long:false,putter:false,kind:'iron'});render();{const ins=document.querySelectorAll('[data-set=kshort]');ins[ins.length-1]?.focus()}break;
    case 'moveClub':{const i=+el.dataset.i,j=i+ +el.dataset.d;const a=dP().clubs;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render();break;}
    case 'delClub':{const i=+el.dataset.i;const c=dP().clubs[i];const used=Object.values(S.rounds).some(r=>r.holes.some(h=>h.shots.some(x=>x.c===c.id)));
      if(used){c.bag=false;toast('Kij ma zapisane uderzenia – przeniesiony poza torbę');render();return}
      if(dP().types.some(t=>t.club===c.id)&&dP().clubs.length>1){dP().types.forEach(t=>{if(t.club===c.id)t.club=dP().clubs.find(x=>x.id!==c.id).id})}
      dP().clubs.splice(i,1);render();break;}
    case 'saveSettings':saveSettings();break;
    case 'resetDraft':draftS=null;render();break;
    case 'exportJson':saveFile(`golf-dziennik-${today()}.json`,JSON.stringify({settings:S.settings,rounds:S.rounds},null,1),'application/json');break;
    case 'exportCsv':saveFile(`golf-uderzenia-${today()}.csv`,csv(),'text/csv');break;
    case 'importJson':$('#importFile').click();break;
    case 'ghSave':{const c=ghCfg();c.repo=($('#ghRepo').value||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'');
      const t=($('#ghToken').value||'').trim();if(t)c.token=t;c.auto=$('#ghAutoChk').checked;ghSet(c);$('#ghToken').value='';
      $('#ghToken').placeholder=c.token?'zapisany – wpisz nowy, aby zmienić':'github_pat_…';toast('Zapisano ustawienia synchronizacji');ghShow();break}
    case 'ghSendNow':ghSend(true);break;
    case 'wipeRounds':{const ids=Object.keys(S.rounds);
      if(!ask(el,'wipe',ids.length?`Usunąć wszystkie rundy (${ids.length}) wszystkich graczy i zacząć historię kryteriów od v1? Tego nie da się cofnąć – jeśli chcesz, najpierw pobierz kopię JSON.`:'Zacząć historię kryteriów od v1? Obecne kryteria staną się wersją v1 z dzisiejszą datą.',{ok:ids.length?'Usuń wszystko':'Zacznij od v1',danger:!!ids.length}))return;if(!confirmDiscard(el))return;
      const now=Date.now();ids.forEach(id=>{delete S.rounds[id];S.tomb[id]=now;meta.dirty['r-'+id]=now});
      S.settings.players.forEach(p=>{p.cv=1;p.history=[{v:1,at:today(),crit:Object.fromEntries(p.types.map(t=>[t.id,t.crit.slice()]))}]});
      ui.rid=null;ui.review=null;ui.cv='all';ui.course='';touchSettings();render();toast(ids.length?'Usunięto rundy: '+ids.length+', kryteria od v1':'Historia kryteriów zaczyna się od v1');break;}
  }
}
function switchPlayer(id){S.settings.activePlayer=id;touchSettings();const r=curRound();if(r&&roundPlayer(r)!==id)ui.rid=null;ui.review=null;ui.sel=null;ui.draft={t:null,c:null};ui.cv='all';ui.course='';lsSave();render()}
function saveCourse(r){
  if(!r||!r.course)return;
  const cs=S.settings.courses;let c=(r.courseId&&courseById(r.courseId))||cs.find(x=>x.name.toLowerCase()===r.course.toLowerCase());
  if(!c){if(r.holes.length<9)return;c={id:'c'+newId(),name:r.course,city:'',n:r.holes.length===18?18:(r.holes[0].no>9?18:9),pars:[],si:[],tees:[],verified:true};cs.push(c);r.courseId=c.id;touchRound(r)}
  else if(!r.courseId){r.courseId=c.id;touchRound(r)}
  const before=JSON.stringify([c.pars,c.si]);const pars=c.pars.slice(),si=c.si.slice();
  r.holes.forEach(h=>{pars[h.no-1]=h.par;if(h.si)si[h.no-1]=h.si});
  for(let i=0;i<pars.length;i++)if(pars[i]==null)pars[i]=null;
  c.pars=pars;c.si=si;
  if(JSON.stringify([c.pars,c.si])!==before)touchSettings();
}
document.addEventListener('click',act);
/* pokrętło odległości: przeciąganie, kółko myszy, klawiatura */
(function(){let drag=null;
  document.addEventListener('pointerdown',e=>{const d=e.target.closest('#dial');if(!d)return;e.preventDefault();
    const v0=curDistM();drag={id:e.pointerId,x:e.clientX,v0:v0??0,v:v0??0,lastX:e.clientX,lastT:performance.now(),vel:0};d.classList.add('drag');try{d.setPointerCapture(e.pointerId)}catch(_){}});
  document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const now=performance.now(),dt=Math.max(1,now-drag.lastT);
    const sp=Math.abs(e.clientX-drag.lastX)/dt;drag.acc=(drag.acc||0)+(e.clientX-drag.lastX)*(sp>1.2?2.5:1);drag.lastX=e.clientX;drag.lastT=now;
    const v=Math.max(0,Math.min(DIST_MAX,Math.round(drag.v0-drag.acc/DIST_PX)));if(v!==drag.v){drag.v=v;paintDial(v);if(navigator.vibrate&&v%10===0)navigator.vibrate(4)}});
  const end=e=>{if(!drag||e.pointerId!==drag.id)return;const d=document.getElementById('dial');if(d)d.classList.remove('drag');const moved=drag.v!==drag.v0;const v=drag.v;drag=null;if(moved)commitDist(v)};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('wheel',e=>{const d=e.target.closest('#dial');if(!d)return;e.preventDefault();const dv=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)>0?1:-1;
    const v=Math.max(0,Math.min(DIST_MAX,(curDistM()??0)+dv*(e.shiftKey?10:1)));paintDial(v);commitDist(v,false);clearTimeout(ui.distT);ui.distT=setTimeout(render,500)},{passive:false});
  document.addEventListener('keydown',e=>{if(e.target.id!=='dial')return;const k={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1,PageDown:-10,PageUp:10}[e.key];if(!k)return;e.preventDefault();
    commitDist((curDistM()??0)+k);document.getElementById('dial')?.focus()});
})();
document.addEventListener('change',e=>{
  if(e.target.id==='nCourseSel'){const v=e.target.value;$('#nTee').innerHTML=teeOptions(v);$('#nNewWrap').hidden=v!=='__new';$('#nInfo').textContent=courseInfo(courseById(v));
    const c=courseById(v);const hs=$('#nHoles');if(c&&c.n===9){hs.value='9'}return}
  if(e.target.dataset.set&&draftS){readSet(e.target);if(['kbag','cn','teeHoles','kkind','kdist','atkOn','atkPct','atkExS','atkExL','tatk'].includes(e.target.dataset.set))render();return}act(e)});
document.addEventListener('input',e=>{if(e.target.dataset.set&&draftS){readSet(e.target);return}if(['note','manual','stepsIn','distM'].includes(e.target.dataset.act))act(e)});
$('#playerSel').addEventListener('change',e=>{const id=e.target.value;e.target.value=S.settings.activePlayer;if(!confirmDiscard(null,()=>{draftS=null;switchPlayer(id)}))return;switchPlayer(id)});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.settings||!j.rounds)throw 0;
  let n=0;Object.values(j.rounds).forEach(r=>{const loc=S.rounds[r.id];if(!loc||(r.updated||0)>(loc.updated||0)){S.rounds[r.id]=r;markDirty('r-'+r.id);n++}});
  if((j.settings.updated||0)>(S.settings.updated||0)){S.settings=normalize(j.settings);markDirty('settings')}
  draftS=null;lsSave();render();toast('Wczytano rundy: '+n)}catch(err){toast('To nie jest kopia z tej aplikacji')}e.target.value=''};rd.readAsText(f)});

function render(){
  const ps=$('#playerSel');if(ps){ps.innerHTML=S.settings.players.map(p=>`<option value="${esc(p.id)}" ${p.id===S.settings.activePlayer?'selected':''}>${esc(playerLabel(p))}</option>`).join('');ps.hidden=S.settings.players.length<2&&ui.view!=='settings'}
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===ui.view?'page':'false'));
  const app=$('#app');
  app.innerHTML=ui.view==='round'?renderRound():ui.view==='analysis'?renderAnalysis():ui.view==='compare'?renderCompare():renderSettings();
}
if(ui.rid&&(!S.rounds[ui.rid]||roundPlayer(S.rounds[ui.rid])!==P().id))ui.rid=null;
render();
initSync();
})();
</script>
<script>
// Rejestracja service workera – zapis aplikacji w pamięci telefonu (praca offline na polu)
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
